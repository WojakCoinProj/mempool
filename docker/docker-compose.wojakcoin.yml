# Wojakcoin mempool
# - api uses network_mode: host so it can reach 127.0.0.1 electrs + wojak RPC
# - db exposes 127.0.0.1:3307
# - web on 127.0.0.1:8080 proxies API to host.docker.internal:8999
#
#   cd /root/mempool-wojakcoin/docker && docker-compose -f docker-compose.wojakcoin.yml --env-file .env up -d

services:
  web:
    image: mempool/frontend:v3.0.0
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 1m
    command: "./wait-for host.docker.internal:8999 --timeout=720 -- nginx -g 'daemon off;'"
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "host.docker.internal"
      BACKEND_MAINNET_HTTP_PORT: "8999"
      MAINNET_ENABLED: "true"
      TESTNET_ENABLED: "false"
      TESTNET4_ENABLED: "false"
      SIGNET_ENABLED: "false"
      REGTEST_ENABLED: "false"
      LIQUID_ENABLED: "false"
      LIQUID_TESTNET_ENABLED: "false"
      LIGHTNING: "false"
      HISTORICAL_PRICE: "false"
      MEMPOOL_WEBSITE_URL: "https://mempool.wojakcoin.cash"
      MINING_DASHBOARD: "true"
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - db

  api:
    image: mempool/backend:v3.0.0
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 1m
    network_mode: host
    command: "./wait-for-it.sh 127.0.0.1:3307 --timeout=720 --strict -- ./start.sh"
    environment:
      # esplora REST (local electrs) + RPC via shape-normalizing proxy
      MEMPOOL_BACKEND: "esplora"
      MEMPOOL_NETWORK: "mainnet"
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "100"
      MEMPOOL_AUTOMATIC_POOLS_UPDATE: "false"
      MEMPOOL_PRICE_UPDATES_PER_HOUR: "0"
      CORE_RPC_HOST: "127.0.0.1"
      CORE_RPC_PORT: "20761"
      CORE_RPC_USERNAME: "${WOJAK_RPC_USER}"
      CORE_RPC_PASSWORD: "${WOJAK_RPC_PASSWORD}"
      CORE_RPC_TIMEOUT: "120000"
      # 13001 = electrs-esplora-proxy (flattens paginated /mempool/txids for mempool backend)
      ESPLORA_REST_API_URL: "http://127.0.0.1:13001"
      ELECTRUM_HOST: "127.0.0.1"
      ELECTRUM_PORT: "50005"
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "3307"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
      FIAT_PRICE_ENABLED: "false"
      LIGHTNING_ENABLED: "false"
    volumes:
      - ./data:/backend/cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.5.21
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-pmempool"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
